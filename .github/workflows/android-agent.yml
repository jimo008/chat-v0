name: Android Agent APK

on:
  push:
    paths:
      - "android-agent/**"
      - "tests/device_proof_message.txt"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare private release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chat-v0-release.p12"

      - name: Test protocol and build signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/chat-v0-release.p12
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: gradle :android-agent:app:testReleaseUnitTest :android-agent:app:assembleRelease

      - name: Prepare latest APK
        run: |
          mkdir -p release
          cp android-agent/app/build/outputs/apk/release/app-release.apk release/support-agent-latest.apk

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs release/support-agent-latest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-v0-agent-release-apk
          path: release/support-agent-latest.apk

      - name: Publish fixed latest APK link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android Agent Latest" --notes "Latest debug APK for testing."
          gh release edit android-latest --notes "Signed release APK with device pairing. Replace the old debug-signed test app before installing this first private-signed release."
          gh release upload android-latest release/support-agent-latest.apk --clobber
