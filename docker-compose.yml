services:
  support-api:
    image: ${IMAGE_REF:-ghcr.io/jimo008/chat-v0:latest}
    env_file: .env
    command: ["/app/support-api"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/support-chat/uploads
    restart: unless-stopped

  support-worker:
    image: ${IMAGE_REF:-ghcr.io/jimo008/chat-v0:latest}
    env_file: .env
    entrypoint: ["/app/support-worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/data/support-chat/uploads
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: support_chat
      MYSQL_USER: support
      MYSQL_PASSWORD: support_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads:
