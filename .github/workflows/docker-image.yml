name: Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "tests/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "supportctl"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: chat_v0_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test backend
        env:
          CHAT_V0_TEST_MYSQL_DSN: root:ci_password@tcp(127.0.0.1:3306)/chat_v0_test?parseTime=true
          CHAT_V0_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test ./...

      - name: Test Widget identity handoff
        run: node --test tests/widget_identity.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jimo008/chat-v0:latest
            ghcr.io/jimo008/chat-v0:${{ github.sha }}
