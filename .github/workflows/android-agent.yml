name: Android Agent APK

on:
  push:
    paths:
      - "android-agent/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create debug signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :android-agent:app:assembleDebug

      - name: Prepare latest APK
        run: |
          mkdir -p release
          cp android-agent/app/build/outputs/apk/debug/app-debug.apk release/support-agent-latest.apk

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs release/support-agent-latest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-v0-agent-debug-apk
          path: release/support-agent-latest.apk

      - name: Publish fixed latest APK link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android Agent Latest" --notes "Latest debug APK for testing."
          gh release upload android-latest release/support-agent-latest.apk --clobber
